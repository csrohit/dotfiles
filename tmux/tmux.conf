
# 🗄️ XDG Base Directory Setup
# Moving plugins to .local/share/tmux/plugins (Standard Data Path)
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins'


# ⌨️ General Settings
# ---------------------------------------------------------
set -g mouse on               # 🖱️ Enable mouse support
set -g base-index 1           # 🔢 Start window numbering at 1
set -g pane-base-index 1      # 🔢 Start pane numbering at 1
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g default-terminal "${TERM}"
setw -g mode-keys vi
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# 🛠️ Keybindings
# ---------------------------------------------------------
# Set prefix to Ctrl + s (Easier to reach than C-b)
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Reload config with 'r'
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Unbind conflicting default bindings
unbind -n C-/
unbind -n C-_
bind '"' choose-window
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind : command-prompt
bind S choose-session

# 🖥️ Terminal & Color Support (Alacritty Optimized)
# ---------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Tc"

set -g window-status-format "#I: #W"

# 🔌 Plugins List
# ---------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator' # 🚀 Seamless Nvim navigation
set -g @plugin 'tmux-plugins/tmux-battery'

# 🐱 Catppuccin Theme Configuration
# ---------------------------------------------------------
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_status_background "#242638"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_color "#{E:@thm_surface_2}"
set -g @catppuccin_date_time_text " %H:%M"

# Load catppuccin theme (use variable)
run "#{TMUX_PLUGIN_MANAGER_PATH}/tmux/catppuccin.tmux"

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 0

set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Initialize TPM (keep as the last line, use variable)
run -b "#{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm"
